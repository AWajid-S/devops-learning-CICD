name: Task 1 Docker CI

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Download repo code into GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python dependencies
      - name: Install dependencies
        run: |
          cd task-1-docker-ci
          pip install -r requirements.txt

      # Run automated tests
      - name: Run tests
        run: |
          cd task-1-docker-ci
          pytest

      # Login to Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          cd task-1-docker-ci
          docker build -t ${{ secrets.DOCKER_USERNAME }}/helloapp:latest .

      # Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/helloapp:latest